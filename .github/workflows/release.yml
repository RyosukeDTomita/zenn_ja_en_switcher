name: Release

# 署名付きタグの push をビルドのトリガーにすることで、
# リリース時点のリポジトリ状態からビルドされた成果物であることを保証する。
on:
  push:
    tags:
      - 'v*'

# 既定は最小権限。必要な権限はジョブ単位で付与する。
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Release 作成・アセットアップロード用
      id-token: write # provenance attestation の OIDC 用
      attestations: write # provenance attestation 書き込み用
    steps:
      # すべての action は commit SHA で pin し、タグ差し替え攻撃を防ぐ。
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      # ロックファイルを固定し、解決済み以外の依存を引かない。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build & zip (Chrome)
        run: bun run zip

      - name: Build & zip (Firefox)
        run: bun run zip:firefox

      # ビルド成果物に SLSA provenance attestation を付与する。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: '.output/*.zip'

      # 第三者 action を増やさないよう、Release 作成は組み込みの gh CLI で行う。
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            .output/*.zip
